<!DOCTYPE html> {% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja ÉdeCasa</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        *{
            box-sizing: border-box;
            overflow: hidden;
        }

        body{
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: var(--loja-fundo, #f4f6f9);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .body_principal{
            display: flex;
            flex-direction: row;
            flex: 1;   
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 6px;
            overflow: visible;
        }

        .telhado {
            width: 42px;
            height: 46px;
            border-top: 5px solid white;
            border-right: 5px solid white;
            transform: rotate(-40deg);
            position: absolute;
            top: -4px;
            right: 12px; 
        }

        h1 {
            margin: 0;
            font-family: 'Pacifico', cursive;
            color: white;
            font-size: 22px;
            font-weight: 550;
            text-transform: none;
            letter-spacing: 0;
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            line-height: 1;
        }

        .subtitulo {
            color: white;
            font-family: "Segoe UI", Arial;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: -5px;
        }

        .painel_superior {
            background: var(--loja-header, #1f2126); 
            display: flex;
            width: 100%;
            height: 64px; 
            align-items: center;
            padding: 0 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            position: relative;
        }

        .painel_lateral{
            background: linear-gradient(180deg, var(--loja-sidebar, #1f2126), var(--loja-sidebar-2, #2b2f34));
            display: flex;
            width: 148px;
            height: 100%;
            margin-top: auto;
            padding-top: 16px;
            box-sizing: border-box;
            flex-direction: column;
            box-shadow:3px 0 15px rgba(0,0,0,0.2);      
        }
        
        .bt_painel {
            display: flex;
            align-items: center;
            width: 100%;
            height: 44px;
            text-decoration: none;
            color: #d7d7d7;
            padding-left: 16px;
            padding-right: 8px;
            border-left: 4px solid transparent;
            font-size: 13px;
        }

        .bt_painel:hover{
            cursor: pointer;
            background: color-mix(in srgb, var(--loja-sidebar, #1f2126) 72%, #000000 28%);
            color: white;
        }

        .bt_painel.ativo{
            background: color-mix(in srgb, var(--loja-sidebar, #1f2126) 62%, #000000 38%);
            color: white;
            border-left: 4px solid var(--loja-destaque, #5aa2ff);
        }

        .bt_painel.ativo:hover{
            background: color-mix(in srgb, var(--loja-sidebar, #1f2126) 52%, #000000 48%);
        }

        .texto_menu {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .container{
            width: 100%;
            height: 100%;
            text-align: center;
        }

        #config{
            margin-top: auto;
            margin-bottom: 20px;
        }

        .icone_menu {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            flex-shrink: 0;
        }


        .atalhos-hint {
            margin-left: auto;
            color: rgba(255,255,255,0.72);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 5px 10px;
        }

        .atalhos-hint kbd {
            background: #111827;
            color: #fff;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 11px;
            margin: 0 2px;
        }
    </style>
</head> 

<body>
    <div class="painel_superior">
        <div class="logo-container">
            <div class="telhado"></div>
            <h1>É de casa</h1>
            <div class="subtitulo">Cama, Mesa e Banho</div>
        </div>
        <div class="atalhos-hint">Atalhos <kbd>Alt</kbd> + <kbd>/</kbd></div>
    </div>

    <div class="body_principal">
        <div class="painel_lateral">
            <a href="{% url 'front_end:dashboard' %}" data-pagina="dashboard" class="bt_painel ativo" target="conteudo">
                <img src="{% static 'front_end/img/alinhamento-do-grafico.png' %}" alt="" class="icone_menu"> 
                    <span class="texto_menu">Dashboard</span>
            </a>
            <a href="{% url 'front_end:produtos' %}" data-pagina="produtos" class="bt_painel" target="conteudo">
                <img src="{% static 'front_end/img/adicionar-ao-carrinho.png' %}" alt="" class="icone_menu"> 
                    <span class="texto_menu">Produtos</span>
            </a>
            <a href="{% url 'front_end:clientes' %}" data-pagina="clientes" class="bt_painel" target="conteudo">
                <img src="{% static 'front_end/img/adicionar-usuario.png' %}" alt="" class="icone_menu"> 
                    <span class="texto_menu">Clientes</span>
            </a>
            <a href="{% url 'front_end:vendas' %}" data-pagina="vendas" class="bt_painel" target="conteudo">
                <img src="{% static 'front_end/img/circulo-usd.png' %}" alt="" class="icone_menu"> 
                    <span class="texto_menu">Vendas</span>
            </a>
            <a id="config" href="{% url 'front_end:configuracoes' %}" data-pagina="configuracoes" class="bt_painel" target="conteudo">
                <img src="{% static 'front_end/img/definicoes.png' %}" alt="" class="icone_menu"> 
                    <span class="texto_menu">Configurações</span>
            </a> 
        </div>

        <div class="container">
            <iframe name="conteudo" src="{% url 'front_end:dashboard' %}" width="100%" height="100%" style="border: none;"></iframe>
        </div>
    </div>
</body>
{% include "partials/loja_config.html" %}
<script>
document.querySelectorAll(".bt_painel").forEach(botao => {

    botao.addEventListener("click", function(){

        document.querySelectorAll(".bt_painel").forEach(b=>{
            b.classList.remove("ativo")
        })

        this.classList.add("ativo")

    })

})  
</script>
</html>
